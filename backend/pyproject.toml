[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "krushi-mitra"
version = "1.0.0"
description = "Krushi Mitra — Voice AI advisor for cotton farmers in Vidarbha, Maharashtra"
requires-python = ">=3.10, <3.15"

dependencies = [
    "livekit-agents[deepgram,openai,silero,turn-detector]~=1.4",
    "livekit-murf>=0.1.1",
    "livekit-plugins-noise-cancellation~=0.2",
    "python-dotenv",
    "supabase>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
